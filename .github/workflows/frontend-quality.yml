name: frontend-quality

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Frontend build gate
        run: npm run check:lint && npm run check:typecheck && npm run check:test && npm run check:build

  integration-e2e:
    if: ${{ vars.CDAS_ENABLE_INTEGRATION_E2E == 'true' }}
    runs-on: ubuntu-latest
    needs:
      - frontend-build
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_BASE_URL: ${{ secrets.CDAS_API_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate integration e2e secret
        run: |
          if [ -z "${VITE_API_BASE_URL}" ]; then
            echo "CDAS_API_BASE_URL secret is empty; disable integration-e2e or provide secret."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Install Python deps for e2e script
        run: python -m pip install --upgrade pip requests

      - name: Integration e2e gate
        run: npm run check:api-e2e
